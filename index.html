<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Image Gallery</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>My Image Gallery</h1>
        <p>Explore beautiful images</p>
    </header>

   <main>

    <div class="filters">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="nature">Nature</button>
        <button class="filter-btn" data-filter="animals">Animals</button>
        <button class="filter-btn" data-filter="mountains">Mountains</button>
    </div>

    <div class="gallery">

            <div class="gallery-item" data-category="mountains">
                <img src="https://picsum.photos/id/1015/600/400" 
                     alt="Mountain">
                <h3>Mountain</h3>
            </div>

            <div class="gallery-item" data-category="nature">
                <img src="https://picsum.photos/id/1016/600/400" 
                     alt="Nature">
                <h3>Nature</h3>
            </div>

            <div class="gallery-item" data-category="animals">
                <img src="https://picsum.photos/id/1025/600/400" 
                     alt="Dog">
                <h3>Dog</h3>
            </div>

           <div class="gallery-item" data-category="animals">
                <img src="https://picsum.photos/id/1024/600/400" 
                     alt="Animal">
                <h3>Animal</h3>
            </div>

           <div class="gallery-item" data-category="nature">
                <img src="https://picsum.photos/id/1035/600/400" 
                     alt="Beach">
                <h3>Beach</h3>
            </div>
<div class="gallery-item" data-category="nature">
                <img src="https://picsum.photos/id/1043/600/400" 
                     alt="Forest">
                <h3>Forest</h3>
            </div>

        </div>

    </main>

    <script src="script.js"></script>

</body>
</html>
